name: gn-fetch
on:
  schedule:
    - cron: "40 */6 * * *"   # 予備（6時間おき）。通常は leak-live Worker が 20分おきに workflow_dispatch で起動する
  workflow_dispatch:
    inputs:
      kind:
        description: "short = 1h/3h だけ / full = 1h/3h/1d/7d"
        required: false
        default: "full"
concurrency:
  group: gn-fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Fetch Google News RSS (plan from Worker) and push to Worker
        env:
          INGEST_KEY: ${{ secrets.LEAK_INGEST_KEY }}
          KIND: ${{ github.event.inputs.kind || 'full' }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: python3 scripts/gn_fetch.py
